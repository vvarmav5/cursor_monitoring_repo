{% extends "base.html" %}
{% block title %}Set admin password{% endblock %}
{% block content %}
<h1>Set the admin password</h1>
<p class="lede">The username is admin. This password stays on this machine as a hash.</p>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" action="{{ url_for('setup_submit') }}" class="panel">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="new-password" required>
  <label for="confirm">Confirm password</label>
  <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
  <button type="submit">Save password</button>
</form>
{% endblock %}
