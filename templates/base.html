<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Server Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">Server Monitor</a>
    {% if session.get('user') == 'admin' %}
    <nav>
      <a href="{{ url_for('dashboard') }}" {% if active == 'dashboard' %}class="current"{% endif %}>Dashboard</a>
      <a href="{{ url_for('index') }}" {% if active == 'servers' %}class="current"{% endif %}>Server</a>
      <a href="{{ url_for('history') }}" {% if active == 'history' %}class="current"{% endif %}>History</a>
      <form method="post" action="{{ url_for('signout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="sign-out">Sign out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
      <p class="notice">{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
